name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', database: '0.2.3', http: '0.2.2', session: '0.2.2' }
          - { php: '8.5', database: '0.2.3', http: '0.2.2', session: '0.2.2' }
          - { php: '8.2', database: '0.3.0', http: '0.3.0', session: '0.2.3' }
          - { php: '8.5', database: '0.3.0', http: '0.3.0', session: '0.2.3' }
          - { php: '8.2', database: '0.4.0', http: '0.3.1', session: '0.2.4' }
          - { php: '8.5', database: '0.4.0', http: '0.3.1', session: '0.2.4' }
          - { php: '8.2', database: '0.5.0', http: '0.3.3', session: '0.2.5' }
          - { php: '8.5', database: '0.5.0', http: '0.3.3', session: '0.2.5' }
          - { php: '8.2', database: '0.5.0', http: '0.4.0', session: '0.2.6' }
          - { php: '8.5', database: '0.5.0', http: '0.4.0', session: '0.2.6' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install development dependencies
        run: |
          composer require --no-update --no-interaction 'denosyscore/database:${{ matrix.database }}' 'denosyscore/http:${{ matrix.http }}' 'denosyscore/session:${{ matrix.session }}'
          composer install --no-interaction --prefer-dist

      - name: PHP syntax check
        run: |
          if [ -d src ]; then
            find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          else
            echo "No src/ directory to lint."
          fi

      - name: Authentication regression tests
        run: composer test
